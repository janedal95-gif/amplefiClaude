AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Amplefi marketing backend (lead + subscribe)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173,http://localhost:3000"
    Description: Allowed CORS origins
  FromEmail:
    Type: String
    Default: "hello@amplefi.com"
    Description: Sender address for SES auto-reply emails
  NotifyEmails:
    Type: String
    Default: "jane.dalesandro@amplefi.com,jdalesandro@amplefi.com"
    Description: Comma-separated internal notification recipients
  UnsubSecret:
    Type: String
    NoEcho: true
    Default: "replace-with-strong-unsub-secret"
    Description: Secret key used to sign unsubscribe links

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS
        MaxAge: 600

  LeadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  LeadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lead.handler
      Environment:
        Variables:
          LEADS_TABLE: !Ref LeadsTable
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          FROM_EMAIL: !Ref FromEmail
          NOTIFY_EMAILS: !Ref NotifyEmails
          UNSUB_SECRET: !Ref UnsubSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeadsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscribersTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        LeadApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /lead
            Method: POST

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: subscribe.handler
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          FROM_EMAIL: !Ref FromEmail
          NOTIFY_EMAILS: !Ref NotifyEmails
          UNSUB_SECRET: !Ref UnsubSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        SubscribeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /subscribe
            Method: POST

  UnsubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: unsubscribe.handler
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          UNSUB_SECRET: !Ref UnsubSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
      Events:
        UnsubscribeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /unsubscribe
            Method: GET

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
